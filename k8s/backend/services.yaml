apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: medcore
  labels:
    app: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: medcore-backend
      containers:
        - name: auth-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/medcore-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MEDCORE_SERVICE
              value: auth
          envFrom:
            - configMapRef:
                name: medcore-backend-config
            - secretRef:
                name: medcore-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medcore
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 5000
      targetPort: 5000
