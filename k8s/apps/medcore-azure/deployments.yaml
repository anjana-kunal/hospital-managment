apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: medcore-backend
      containers:
        - name: auth-service
          image: medcoredevqkoqpy.azurecr.io/medcore-backend:14
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: MEDCORE_SERVICE
              value: auth
          envFrom:
            - configMapRef:
                name: medcore-backend-config
            - secretRef:
                name: medcore-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
