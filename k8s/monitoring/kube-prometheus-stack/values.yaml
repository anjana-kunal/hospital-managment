grafana:
  enabled: true
  adminPassword: "prom-operator"
  additionalDataSources:
    - name: Loki
      type: loki
      # Here is your exact Loki service URL!
      url: http://medcore-logging-loki.logging.svc.cluster.local:3100
      access: proxy
      isDefault: false


alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

prometheus:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  prometheusSpec:
    retention: 24h
    evaluationInterval: 30s
    scrapeInterval: 30s
    enableAdminAPI: true
    externalLabels:
      cluster: medcore-aks